<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartMed | Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body data-page="users">
    <div class="app-shell">
      <aside id="sidebar" class="sidebar"></aside>
      <div class="main-panel">
        <header class="topbar">
          <div class="topbar-left">
            <button id="sidebarToggle" class="btn"><i class="bi bi-list"></i></button>
            <div class="topbar-title"><h2>Users</h2></div>
          </div>
          <div class="user-chip">
            <div class="user-avatar" id="currentUserInitials">A</div>
            <div>
              <div id="currentUserName">Admin</div>
              <small id="currentUserRole">ADMIN</small>
            </div>
          </div>
        </header>

        <main class="page-content">
          <div class="page-header">
            <div>
              <h1>User Management</h1>
              <div class="section-subtitle">Admin-only user controls</div>
            </div>
          </div>

          <div class="form-card mb-4">
            <h5 id="userFormTitle">Add User</h5>
            <form id="userForm" novalidate>
              <input type="hidden" id="userRecordId" />
              <div class="form-grid">
                <div>
                  <label class="form-label" for="userNameInput">Name</label>
                  <input type="text" class="form-control" id="userNameInput" required />
                </div>
                <div>
                  <label class="form-label" for="userUsernameInput">Username</label>
                  <input type="text" class="form-control" id="userUsernameInput" required />
                </div>
                <div>
                  <label class="form-label" for="userPasswordInput">Password</label>
                  <input type="password" class="form-control" id="userPasswordInput" required />
                </div>
                <div>
                  <label class="form-label" for="userRoleInput">Role</label>
                  <select class="form-select" id="userRoleInput">
                    <option value="admin">Admin</option>
                    <option value="staff">Staff</option>
                  </select>
                </div>
                <div>
                  <label class="form-label" for="userStatusInput">Status</label>
                  <select class="form-select" id="userStatusInput">
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                  </select>
                </div>
              </div>
              <div class="d-flex gap-2 mt-3">
                <button type="submit" class="btn btn-primary">Save User</button>
                <button type="button" class="btn btn-outline-secondary" id="cancelUserEdit">Cancel</button>
              </div>
            </form>
          </div>

          <div class="card-panel section-card">
            <div class="table-header">
              <h5 class="mb-0">User Directory</h5>
            </div>
            <div class="table-responsive">
              <table class="table">
                <thead>
                  <tr>
                    <th>User ID</th>
                    <th>Name</th>
                    <th>Username</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="userTableBody"></tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/users.js"></script>
  </body>
</html>
