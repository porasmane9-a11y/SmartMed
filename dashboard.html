<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartMed | Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body data-page="dashboard">
    <div class="app-shell">
      <aside id="sidebar" class="sidebar"></aside>
      <div class="main-panel">
        <header class="topbar">
          <div class="topbar-left">
            <button id="sidebarToggle" class="btn"><i class="bi bi-list"></i></button>
            <div class="topbar-title"><h2>Dashboard</h2></div>
          </div>
          <div class="user-chip">
            <div class="user-avatar" id="currentUserInitials">A</div>
            <div>
              <div id="currentUserName">Admin</div>
              <small id="currentUserRole">ADMIN</small>
            </div>
          </div>
        </header>

        <main class="page-content">
          <div class="page-header">
            <div>
              <h1>Inventory Overview</h1>
              <div class="section-subtitle">Realtime stock visibility and operational alerts</div>
            </div>
          </div>

          <div class="stats-grid" id="statsGrid"></div>

          <div class="chart-grid">
            <div class="chart-box">
              <h5>Medicines by Category</h5>
              <canvas id="categoryChart"></canvas>
            </div>
            <div class="chart-box">
              <h5>Stock Movement</h5>
              <canvas id="stockMovementChart"></canvas>
            </div>
            <div class="chart-box">
              <h5>Expiry Overview</h5>
              <canvas id="expiryChart"></canvas>
            </div>
          </div>

          <div class="row g-4">
            <div class="col-lg-6">
              <div class="card-panel section-card">
                <div class="table-header">
                  <h5 class="mb-0">Alerts & Notifications</h5>
                </div>
                <div class="p-3">
                  <div id="alertList" class="alert-list"></div>
                </div>
              </div>
            </div>
            <div class="col-lg-6">
              <div class="card-panel section-card">
                <div class="table-header">
                  <h5 class="mb-0">Recent Transactions</h5>
                </div>
                <div class="table-responsive">
                  <table class="table">
                    <thead>
                      <tr>
                        <th>Date</th>
                        <th>Medicine</th>
                        <th>Batch</th>
                        <th>Type</th>
                        <th>Qty</th>
                        <th>User</th>
                      </tr>
                    </thead>
                    <tbody id="recentTransactionsTable"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/dashboard.js"></script>
  </body>
</html>
