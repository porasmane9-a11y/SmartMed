<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartMed | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="login-page">
    <div class="login-shell">
      <div class="login-card">
        <div class="login-brand">
          <div class="brand-icon"><i class="bi bi-heart-pulse"></i></div>
          <div>
            <h1>SmartMed</h1>
            <p>Medicine stock & expiry management</p>
          </div>
        </div>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input id="username" name="username" type="text" class="form-control" placeholder="Enter username" required />
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input id="password" name="password" type="password" class="form-control" placeholder="Enter password" required />
          </div>

          <button type="submit" class="btn btn-primary w-100 btn-lg">Login</button>
        </form>

        <div class="demo-credentials mt-4">
          <h6>Demo credentials</h6>
          <div class="credential-row"><span>Admin</span><strong>admin / admin123</strong></div>
          <div class="credential-row"><span>Staff</span><strong>staff / staff123</strong></div>
        </div>
      </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div id="loginToast" class="toast align-items-center text-bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body" id="loginToastText"></div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
      const loginForm = document.getElementById('loginForm');
      const loginToast = document.getElementById('loginToast');
      const loginToastText = document.getElementById('loginToastText');

      if (getCurrentUser()) {
        window.location.href = 'dashboard.html';
      }

      loginForm.addEventListener('submit', function (event) {
        event.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!username || !password) {
          showToast('Please enter both username and password.', 'danger');
          return;
        }

        if (window.location.protocol.startsWith('http')) {
          fetch('login.php', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify({ username, password })
          })
          .then((res) => res.json())
          .then((data) => {
            if (data.success && data.user) {
              setCurrentUser(data.user);
              window.location.href = data.redirect || 'dashboard.html';
            } else {
              showToast(data.error || 'Invalid username or password.', 'danger');
            }
          })
          .catch(() => {
            localLoginFallback(username, password);
          });
        } else {
          localLoginFallback(username, password);
        }
      });

      function localLoginFallback(username, password) {
        const state = getState();
        const user = state.users.find((item) => item.username === username && item.password === password);

        if (!user) {
          showToast('Invalid username or password.', 'danger');
          return;
        }

        setCurrentUser({
          id: user.id,
          name: user.name,
          username: user.username,
          role: user.role
        });

        addAuditLog('Login', user.username, { user: user.username, action: 'Login' });
        window.location.href = 'dashboard.html';
      }

      function showToast(message, type) {
        const toastNode = bootstrap.Toast.getOrCreateInstance(loginToast);
        loginToast.className = 'toast align-items-center border-0 text-bg-' + type;
        loginToastText.textContent = message;
        toastNode.show();
      }
    </script>
  </body>
</html>
