<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartMed | Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body data-page="settings">
    <div class="app-shell">
      <aside id="sidebar" class="sidebar"></aside>
      <div class="main-panel">
        <header class="topbar">
          <div class="topbar-left">
            <button id="sidebarToggle" class="btn"><i class="bi bi-list"></i></button>
            <div class="topbar-title"><h2>Settings</h2></div>
          </div>
          <div class="user-chip">
            <div class="user-avatar" id="currentUserInitials">A</div>
            <div>
              <div id="currentUserName">Admin</div>
              <small id="currentUserRole">ADMIN</small>
            </div>
          </div>
        </header>

        <main class="page-content">
          <div class="page-header">
            <div>
              <h1>Settings</h1>
              <div class="section-subtitle">Configure alerts and system preferences</div>
            </div>
          </div>

          <div class="form-card mb-4">
            <form id="settingsForm">
              <div class="form-grid">
                <div>
                  <label class="form-label" for="expiryWarningDays">Expiry Warning Days</label>
                  <input type="number" class="form-control" id="expiryWarningDays" min="1" />
                </div>
                <div>
                  <label class="form-label" for="themePreference">Theme Preference</label>
                  <select class="form-select" id="themePreference">
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>
                  </select>
                </div>
                <div>
                  <label class="form-label" for="lowStockPreference">Low-stock Alert Preference</label>
                  <select class="form-select" id="lowStockPreference">
                    <option value="enabled">Enabled</option>
                    <option value="disabled">Disabled</option>
                  </select>
                </div>
              </div>
              <div class="mt-3">
                <button type="submit" class="btn btn-primary">Save Settings</button>
              </div>
            </form>
          </div>

          <div class="form-card mb-4">
            <h5>Application Controls</h5>
            <div class="d-flex flex-wrap gap-2 mt-3">
              <button id="resetDemoDataButton" class="btn btn-warning">Reset Demo Data</button>
              <button id="clearDataButton" class="btn btn-danger">Clear Application Data</button>
            </div>
          </div>

          <div class="card-panel section-card">
            <div class="table-header">
              <h5 class="mb-0">Audit History</h5>
            </div>
            <div class="table-responsive">
              <table class="table">
                <thead>
                  <tr>
                    <th>User</th>
                    <th>Action</th>
                    <th>Date/Time</th>
                  </tr>
                </thead>
                <tbody id="auditLogTable"></tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/users.js"></script>
  </body>
</html>
