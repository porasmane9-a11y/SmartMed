<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartMed | Suppliers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body data-page="suppliers">
    <div class="app-shell">
      <aside id="sidebar" class="sidebar"></aside>
      <div class="main-panel">
        <header class="topbar">
          <div class="topbar-left">
            <button id="sidebarToggle" class="btn"><i class="bi bi-list"></i></button>
            <div class="topbar-title"><h2>Suppliers</h2></div>
          </div>
          <div class="user-chip">
            <div class="user-avatar" id="currentUserInitials">A</div>
            <div>
              <div id="currentUserName">Admin</div>
              <small id="currentUserRole">ADMIN</small>
            </div>
          </div>
        </header>

        <main class="page-content">
          <div class="page-header">
            <div>
              <h1>Supplier Management</h1>
              <div class="section-subtitle">Track supplier details and purchase relations</div>
            </div>
          </div>

          <div class="form-card mb-4">
            <h5 id="supplierFormTitle">Add Supplier</h5>
            <form id="supplierForm" novalidate>
              <input type="hidden" id="supplierId" />
              <div class="form-grid">
                <div>
                  <label class="form-label" for="supplierIdInput">Supplier ID</label>
                  <input type="text" class="form-control" id="supplierIdInput" required />
                </div>
                <div>
                  <label class="form-label" for="supplierName">Supplier Name</label>
                  <input type="text" class="form-control" id="supplierName" required />
                </div>
                <div>
                  <label class="form-label" for="supplierPhone">Phone</label>
                  <input type="tel" class="form-control" id="supplierPhone" required />
                </div>
                <div>
                  <label class="form-label" for="supplierEmail">Email</label>
                  <input type="email" class="form-control" id="supplierEmail" required />
                </div>
                <div class="col-12">
                  <label class="form-label" for="supplierAddress">Address</label>
                  <textarea class="form-control" id="supplierAddress" rows="3" required></textarea>
                </div>
              </div>
              <div class="d-flex gap-2 mt-3">
                <button type="submit" class="btn btn-primary">Save Supplier</button>
                <button type="button" class="btn btn-outline-secondary" id="cancelSupplierEdit">Cancel</button>
              </div>
            </form>
          </div>

          <div class="card-panel section-card">
            <div class="table-header">
              <h5 class="mb-0">Suppliers List</h5>
              <input type="text" class="form-control w-50" id="supplierSearch" placeholder="Search suppliers..." />
            </div>
            <div class="table-responsive">
              <table class="table">
                <thead>
                  <tr>
                    <th>Supplier ID</th>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Address</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="supplierTableBody"></tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/suppliers.js"></script>
  </body>
</html>
