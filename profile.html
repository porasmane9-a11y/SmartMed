<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartMed | Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body data-page="profile">
    <div class="app-shell">
      <aside id="sidebar" class="sidebar"></aside>
      <div class="main-panel">
        <header class="topbar">
          <div class="topbar-left">
            <button id="sidebarToggle" class="btn"><i class="bi bi-list"></i></button>
            <div class="topbar-title"><h2>Profile</h2></div>
          </div>
          <div class="user-chip">
            <div class="user-avatar" id="currentUserInitials">A</div>
            <div>
              <div id="currentUserName">Admin</div>
              <small id="currentUserRole">ADMIN</small>
            </div>
          </div>
        </header>

        <main class="page-content">
          <div class="page-header">
            <div>
              <h1>Profile</h1>
              <div class="section-subtitle">Manage profile details</div>
            </div>
          </div>

          <div class="form-card">
            <form id="profileForm">
              <div class="form-grid">
                <div>
                  <label class="form-label" for="profileName">Name</label>
                  <input type="text" class="form-control" id="profileName" required />
                </div>
                <div>
                  <label class="form-label" for="profileUsername">Username</label>
                  <input type="text" class="form-control" id="profileUsername" required />
                </div>
                <div>
                  <label class="form-label" for="profileRole">Role</label>
                  <input type="text" class="form-control" id="profileRole" readonly />
                </div>
              </div>
              <div class="mt-3">
                <button type="submit" class="btn btn-primary">Update Profile</button>
              </div>
            </form>
          </div>
        </main>
      </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/users.js"></script>
  </body>
</html>
