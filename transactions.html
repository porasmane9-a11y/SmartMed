<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartMed | Transactions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body data-page="transactions">
    <div class="app-shell">
      <aside id="sidebar" class="sidebar"></aside>
      <div class="main-panel">
        <header class="topbar">
          <div class="topbar-left">
            <button id="sidebarToggle" class="btn"><i class="bi bi-list"></i></button>
            <div class="topbar-title"><h2>Transactions</h2></div>
          </div>
          <div class="user-chip">
            <div class="user-avatar" id="currentUserInitials">A</div>
            <div>
              <div id="currentUserName">Admin</div>
              <small id="currentUserRole">ADMIN</small>
            </div>
          </div>
        </header>

        <main class="page-content">
          <div class="page-header">
            <div>
              <h1>Transaction History</h1>
              <div class="section-subtitle">Track all stock movement records</div>
            </div>
          </div>

          <div class="card-panel section-card">
            <div class="table-header">
              <h5 class="mb-0">Transactions</h5>
            </div>
            <div class="p-3">
              <div class="row g-3 mb-3">
                <div class="col-md-3">
                  <label class="form-label">Date</label>
                  <input type="date" class="form-control" id="transactionDateFilter" />
                </div>
                <div class="col-md-3">
                  <label class="form-label">Medicine</label>
                  <input type="text" class="form-control" id="transactionMedicineFilter" />
                </div>
                <div class="col-md-3">
                  <label class="form-label">Type</label>
                  <select class="form-select" id="transactionTypeFilter">
                    <option value="">All</option>
                    <option value="STOCK IN">STOCK IN</option>
                    <option value="STOCK OUT">STOCK OUT</option>
                  </select>
                </div>
                <div class="col-md-3">
                  <label class="form-label">User</label>
                  <input type="text" class="form-control" id="transactionUserFilter" />
                </div>
              </div>
            </div>
            <div class="table-responsive">
              <table class="table">
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Medicine</th>
                    <th>Batch</th>
                    <th>Type</th>
                    <th>Quantity</th>
                    <th>User</th>
                  </tr>
                </thead>
                <tbody id="transactionTableBody"></tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/transactions.js"></script>
  </body>
</html>
