<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartMed | Stock Out</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body data-page="stock-out">
    <div class="app-shell">
      <aside id="sidebar" class="sidebar"></aside>
      <div class="main-panel">
        <header class="topbar">
          <div class="topbar-left">
            <button id="sidebarToggle" class="btn"><i class="bi bi-list"></i></button>
            <div class="topbar-title"><h2>Stock Out</h2></div>
          </div>
          <div class="user-chip">
            <div class="user-avatar" id="currentUserInitials">A</div>
            <div>
              <div id="currentUserName">Admin</div>
              <small id="currentUserRole">ADMIN</small>
            </div>
          </div>
        </header>

        <main class="page-content">
          <div class="page-header">
            <div>
              <h1>Stock Out</h1>
              <div class="section-subtitle">Record issued medicine batches and stock reductions</div>
            </div>
          </div>

          <div class="form-card">
            <form id="stockOutForm" novalidate>
              <div class="form-grid">
                <div>
                  <label class="form-label" for="stockOutMedicine">Medicine</label>
                  <select class="form-select" id="stockOutMedicine" required></select>
                </div>
                <div>
                  <label class="form-label" for="stockOutBatch">Batch</label>
                  <select class="form-select" id="stockOutBatch" required></select>
                </div>
                <div>
                  <label class="form-label" for="stockOutQuantity">Quantity</label>
                  <input type="number" class="form-control" id="stockOutQuantity" min="1" required />
                </div>
              </div>
              <div class="mt-3">
                <button type="submit" class="btn btn-primary">Record Stock Out</button>
              </div>
            </form>
            <div id="fefoHint" class="alert alert-light border mt-3 mb-0"></div>
          </div>
        </main>
      </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/stock.js"></script>
  </body>
</html>
