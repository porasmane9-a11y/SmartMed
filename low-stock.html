<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartMed | Low Stock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body data-page="low-stock">
    <div class="app-shell">
      <aside id="sidebar" class="sidebar"></aside>
      <div class="main-panel">
        <header class="topbar">
          <div class="topbar-left">
            <button id="sidebarToggle" class="btn"><i class="bi bi-list"></i></button>
            <div class="topbar-title"><h2>Low Stock</h2></div>
          </div>
          <div class="user-chip">
            <div class="user-avatar" id="currentUserInitials">A</div>
            <div>
              <div id="currentUserName">Admin</div>
              <small id="currentUserRole">ADMIN</small>
            </div>
          </div>
        </header>

        <main class="page-content">
          <div class="page-header">
            <div>
              <h1>Low Stock Alerts</h1>
              <div class="section-subtitle">Medicines below minimum threshold</div>
            </div>
          </div>

          <div class="card-panel section-card">
            <div class="table-responsive">
              <table class="table">
                <thead>
                  <tr>
                    <th>Medicine</th>
                    <th>Current Stock</th>
                    <th>Minimum Stock</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="lowStockTable"></tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/dashboard.js"></script>
  </body>
</html>
