<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartMed | Batches</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body data-page="batches">
    <div class="app-shell">
      <aside id="sidebar" class="sidebar"></aside>
      <div class="main-panel">
        <header class="topbar">
          <div class="topbar-left">
            <button id="sidebarToggle" class="btn"><i class="bi bi-list"></i></button>
            <div class="topbar-title"><h2>Batches</h2></div>
          </div>
          <div class="user-chip">
            <div class="user-avatar" id="currentUserInitials">A</div>
            <div>
              <div id="currentUserName">Admin</div>
              <small id="currentUserRole">ADMIN</small>
            </div>
          </div>
        </header>

        <main class="page-content">
          <div class="page-header">
            <div>
              <h1>Batch Management</h1>
              <div class="section-subtitle">Track batch numbers, expiry dates and storage locations</div>
            </div>
          </div>

          <div class="form-card mb-4">
            <h5 id="batchFormTitle">Add Batch</h5>
            <form id="batchForm" novalidate>
              <input type="hidden" id="batchId" />
              <div class="form-grid">
                <div>
                  <label class="form-label" for="batchMedicine">Medicine</label>
                  <select class="form-select" id="batchMedicine" required></select>
                </div>
                <div>
                  <label class="form-label" for="batchNumber">Batch Number</label>
                  <input type="text" class="form-control" id="batchNumber" required />
                </div>
                <div>
                  <label class="form-label" for="batchQuantity">Quantity</label>
                  <input type="number" class="form-control" id="batchQuantity" min="1" required />
                </div>
                <div>
                  <label class="form-label" for="batchPurchaseDate">Purchase Date</label>
                  <input type="date" class="form-control" id="batchPurchaseDate" required />
                </div>
                <div>
                  <label class="form-label" for="batchExpiryDate">Expiry Date</label>
                  <input type="date" class="form-control" id="batchExpiryDate" required />
                </div>
                <div>
                  <label class="form-label" for="batchSupplier">Supplier</label>
                  <select class="form-select" id="batchSupplier" required></select>
                </div>
                <div>
                  <label class="form-label" for="batchLocation">Storage Location</label>
                  <input type="text" class="form-control" id="batchLocation" required />
                </div>
              </div>
              <div class="d-flex gap-2 mt-3">
                <button type="submit" class="btn btn-primary">Save Batch</button>
                <button type="button" class="btn btn-outline-secondary" id="cancelBatchEdit">Cancel</button>
              </div>
            </form>
          </div>

          <div class="card-panel section-card">
            <div class="table-header">
              <h5 class="mb-0">Batch Inventory</h5>
            </div>
            <div class="table-responsive">
              <table class="table">
                <thead>
                  <tr>
                    <th>Medicine</th>
                    <th>Batch No.</th>
                    <th>Qty</th>
                    <th>Purchase Date</th>
                    <th>Expiry Date</th>
                    <th>Supplier</th>
                    <th>Location</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="batchTableBody"></tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/batches.js"></script>
  </body>
</html>
